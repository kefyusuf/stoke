# registry:2 config — stock settings plus the proxy (pull-through cache) stanza.
# Reference: https://docs.docker.com/docker-hub/image-library/mirror/
version: 0.1
log:
  fields:
    service: mirror
storage:
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true
http:
  addr: :5000
proxy:
  remoteurl: https://registry-1.docker.io
