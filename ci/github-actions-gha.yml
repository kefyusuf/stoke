# GitHub Actions — GitHub-native cache backend variant (type=gha).
#
# No registry login needed and works on fork PRs, but it is GitHub-only:
# - cache lives in GitHub's cache storage (10 GB per repo, LRU eviction)
# - cache does NOT cross repos; fork PRs get their own scope
# - slightly slower than registry cache for large graphs (tarball round trip)
#
# Cache trust policy (why PR exports are safe HERE, unlike a shared registry
# tag): GitHub isolates cache writes per branch. A regular pull_request run
# (merge ref) can READ the base/default-branch cache but only WRITES its own
# branch scope - it can never refresh the default branch's cache.
# - Read-only triggers: issue_comment, pull_request_target, and pull_request
#   with types: [closed] run in the default-branch context with READ-ONLY
#   cache access; cache-to fails there ("failed to reserve cache"). On those
#   events keep cache-from and omit cache-to (or add ignore-error=true);
#   the default-branch push workflow populates the shared cache.
# - The default scope is `buildkit`: multiple images in one repo overwrite
#   each other's cache. Give each image its own scope=<name> (this repo's
#   .github/workflows/ci.yml uses scope=kit-<template>-<target>).
#
# Local builds CANNOT share this cache (it's CI-only). If local<->CI sharing
# matters, use ci/github-actions.yml (type=registry) instead.
#
# Actions are SHA-pinned (supply-chain hardening); trailing comments carry the
# major tag. Bump via Dependabot or manually.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (with gha cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile            # TODO: your Dockerfile path
          push: false                   # add your push/tags step as needed
          cache-from: type=gha
          cache-to: type=gha,mode=max
