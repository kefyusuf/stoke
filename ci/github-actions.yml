# GitHub Actions — platform-independent shared cache (registry backend).
#
# The cache ref lives in GHCR next to your image, so local builds and CI share
# the SAME ref: set CACHE_REF to the same value in templates/build.sh locally.
#
# Two conditional build steps:
#   * push to main    -> imports AND refreshes the shared buildcache ref
#   * pull requests   -> import only, so a broken PR can never poison main's cache
#                        (same-repo PRs read the cache; FORK PRs cannot read the
#                        private buildcache manifest and just build cold)
#
# Actions are SHA-pinned (supply-chain hardening) — bump via Dependabot or
# manually; the trailing comment carries the major tag for readability.
# Adjust: the `file:` path, `tags:`, and the cache ref naming as you like.
name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # GHCR rejects uppercase image paths — normalize github.repository.
      - name: Normalize image name to lowercase
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ github.repository }}

      # PRs from forks can't push to GHCR - cache import still works below.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR — import cache only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile                    # TODO: your Dockerfile path
          push: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:buildcache

      - name: Build (main — import + refresh shared cache)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile                    # TODO: your Dockerfile path
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:buildcache,mode=max

# Notes:
# - GHCR cache manifests are private like images; GITHUB_TOKEN covers same-repo.
# - Fork PRs: GITHUB_TOKEN is read-only and scoped to the fork, so the private
#   buildcache ref is unreachable — those builds run cold (BuildKit logs a
#   warning and continues). Same-repo PRs get the warm cache.
# - Want GitHub-native caching instead (no registry, fork-PR friendly, but
#   GitHub-only)? See github-actions-gha.yml.
