# Supply-chain gate for PRs: flags dependency changes that introduce known
# vulnerabilities or incompatible licenses (the lockfiles in templates/ and
# the pinned actions are what it reviews). Cheap, secretless, industry norm.
name: dependency-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # the templates' lockfiles are examples; licenses there are all MIT-compatible
          warn-on-openssf-scorecard-level: 3
