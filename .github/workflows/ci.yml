# CI — the kit eating its own dogfood: lint, parse, and actually build every
# shipped template on every push. The template builds use the type=gha cache
# with mode=max — the same pattern the kit teaches, exercised for real.
#
# Actions are SHA-pinned (supply-chain hardening); trailing comments carry the
# major tag. Bump via the dependabot github-actions ecosystem.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The README promises `./setup/foo.sh`; a fresh Linux/WSL clone only
      # honors that if the executable bit is committed (mode 100755).
      - name: exec bits (every tracked .sh must be executable)
        run: |
          git ls-files -s -- '*.sh' | \
            awk '$1 != "100755" { print "not executable: " $4; bad=1 } END { exit bad }'

      - name: shellcheck (all shipped scripts, style severity)
        run: |
          docker run --rm -v "$PWD:/wk" -w /wk koalaman/shellcheck:stable@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d \
            --severity=style --external-sources --source-path=SCRIPTDIR \
            setup/setup-engine.sh setup/setup-nerdctl.sh setup/protect-distro.sh \
            setup/verify.sh setup/teardown.sh setup/doctor.sh setup/init-project.sh \
            setup/lib/common.sh templates/build.sh

      - name: PSScriptAnalyzer (PowerShell scripts)
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          $findings = @(Invoke-ScriptAnalyzer -Path setup -Recurse -Settings PSScriptAnalyzerSettings.psd1) +
                      @(Invoke-ScriptAnalyzer -Path templates -Recurse -Settings PSScriptAnalyzerSettings.psd1)
          if ($findings.Count) {
            $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
            exit 1
          }
          "PSScriptAnalyzer: clean"

      - name: unit tests (bash harness)
        run: bash tests/run-tests.sh

      - name: bash -n (syntax)
        run: for f in setup/*.sh setup/lib/*.sh templates/build.sh; do bash -n "$f"; done

      - name: YAML parse (compose files, CI templates, mirror config)
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install -q "pyyaml==6.0.2"
          python3 - <<'EOF'
          import pathlib, sys, yaml
          files = list(pathlib.Path(".").rglob("*.yml"))
          for f in files:
              yaml.safe_load(f.read_text(encoding="utf-8"))
              print(f"OK  {f}")
          print(f"{len(files)} YAML file(s) parsed")
          EOF

      - name: markdown relative links
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          bad = 0
          for md in pathlib.Path(".").rglob("*.md"):
              for m in re.finditer(r'\]\(([^)#]+?)(?:#[^)]*)?\)', md.read_text(encoding="utf-8")):
                  link = m.group(1)
                  if link.startswith(("http://", "https://", "mailto:")) or link == "":
                      continue
                  if not (md.parent / link).resolve().exists():
                      print(f"BAD link : {md} -> {link}"); bad += 1
          sys.exit(1 if bad else 0)
          EOF

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full-history secret scan)
        run: |
          # image tag: v8.24.3 — bump tag comment + digest together
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            detect --source /repo --redact -v

  templates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # buildkit type=gha cache export
    strategy:
      fail-fast: false
      matrix:
        template: [node-ts, rust, go]
        target: [prod, dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.template }} (${{ matrix.target }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./templates/${{ matrix.template }}
          push: false
          load: ${{ matrix.target == 'prod' }}
          tags: kit-${{ matrix.template }}:${{ matrix.target }}
          cache-from: type=gha,scope=kit-${{ matrix.template }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=kit-${{ matrix.template }}-${{ matrix.target }}

      # The kit's own promise, exercised in CI: the prod image actually serves.
      - name: Smoke (prod serves HTTP)
        if: matrix.target == 'prod'
        run: |
          docker run -d --rm --name kit-smoke-${{ matrix.template }} \
            -p 127.0.0.1:3210:3000 "kit-${{ matrix.template }}:prod"
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3210/ | grep -q '"ok":true'; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { docker logs kit-smoke-${{ matrix.template }} || true; exit 1; }
          echo "smoke OK: $(curl -s http://127.0.0.1:3210/)"
          docker stop "kit-smoke-${{ matrix.template }}" >/dev/null

  # Single merge-gate result: branch protection requires THIS job instead of
  # the individual lint/secrets/matrix names, so adding or renaming templates
  # never silently weakens the gate.
  ci-ok:
    if: always()
    needs: [lint, secrets, templates]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every CI job to have passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::one or more required CI jobs failed or were cancelled"
            exit 1
          fi
          echo "all required CI jobs passed"
