# E2E on a REAL Windows runner: WSL2 + Ubuntu, the kit's documented path,
# end to end. Not push-gated: nightly (upstream drift detection) + on demand.
#
# What it proves, on a machine the kit has never seen:
#   1. WSL2 + Ubuntu distro boot still works on current Windows (setup-wsl.ps1's domain)
#   2. setup-engine.sh installs the engine in a fresh distro - guards allow it,
#      consent passes unattended, docker service comes up
#   3. verify.sh passes: cold/warm cache speedup + registry cache round trip
#   4. teardown.sh --dry-run previews, then teardown.sh --yes removes everything
#      again (the kit's reversibility promise, exercised for real)
#
# Runner WSL images shift under us - that is exactly what this job catches
# before users do. Scheduled nightly + dispatch-only on purpose; expect small
# iterations on runner-image changes.
name: windows-e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SHA-pinned to Vampire/setup-wsl v7 (action handles the otherwise
      # interactive first-launch user creation; Dependabot keeps the pin fresh).
      - name: Install WSL2 + Ubuntu-22.04 (non-interactive)
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7
        with:
          distribution: Ubuntu-22.04
          use-cache: false
          wsl-conf: |
            [boot]
            systemd=true
          additional-packages: sudo curl ca-certificates
          wsl-shell-user: kitrunner

      - name: Copy repo into the distro (ext4 - the kit refuses /mnt/*)
        shell: pwsh
        run: |
          $drive = $env:GITHUB_WORKSPACE.Substring(0,1).ToLower()
          $mnt = "/mnt/$drive" + ($env:GITHUB_WORKSPACE.Substring(2) -replace '\\','/')
          wsl -d Ubuntu-22.04 -u root -- bash -c "mkdir -p /home/kitrunner/work && cp -a '$mnt/.' /home/kitrunner/work/kit/ && chown -R kitrunner:kitrunner /home/kitrunner/work"
          # the action creates kitrunner but does not make it the distro default
          # user - always pass -u kitrunner explicitly (kit scripts refuse root)
          wsl -d Ubuntu-22.04 -u kitrunner -- bash -lc "cd ~/work/kit && ./tests/run-tests.sh"

      - name: setup-engine.sh --yes in a fresh distro
        shell: pwsh
        run: |
          wsl -d Ubuntu-22.04 -u kitrunner -- bash -lc "cd ~/work/kit && ./setup/setup-engine.sh --yes"

      - name: verify.sh (cache round trip on real WSL2)
        shell: pwsh
        run: |
          wsl -d Ubuntu-22.04 -u kitrunner -- bash -lc "cd ~/work/kit && ./setup/verify.sh"

      - name: teardown --dry-run, then real teardown, then sanity
        shell: pwsh
        run: |
          wsl -d Ubuntu-22.04 -u kitrunner -- bash -lc "cd ~/work/kit && ./setup/teardown.sh --dry-run"
          wsl -d Ubuntu-22.04 -u kitrunner -- bash -lc "cd ~/work/kit && ./setup/teardown.sh --yes"
          wsl -d Ubuntu-22.04 -u kitrunner -- bash -lc "! command -v docker && echo 'teardown sanity OK: docker is gone'"
